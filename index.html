<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Bio-Hunter: Warden Protocol — Prototype</title>
<style>
  :root { --ink:#e9e7df; --mut:#9aa39a; --line:#3c5a47; --acc:#7fe0b5; --warn:#e8a04a; --bad:#e0524a; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:#050806; color:var(--ink); font-family:"Noto Sans Thai","Sarabun","Segoe UI",Tahoma,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; height:100dvh; overflow:hidden; --fh:28px; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #wrap { position:relative; width:min(100vw, calc((100vh - var(--fh)) * 1.6)); width:min(100vw, calc((100dvh - var(--fh)) * 1.6)); aspect-ratio:16/10; flex:none; }
  canvas { display:block; width:100%; height:100%; background:#0b100d; cursor:crosshair; touch-action:none; }
  /* จอแนวตั้ง (มือถือ/แท็บเล็ต): ขอให้หมุนจอ — มีปุ่มเล่นต่อสำหรับคนที่ล็อกการหมุนจอไว้ */
  #rot { display:none; position:fixed; inset:0; z-index:70; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:28px; text-align:center; background:rgba(5,8,6,.97); color:var(--ink); }
  #rot .ic { font-size:60px; line-height:1; color:var(--acc); display:inline-block; animation:rotHint 2.6s ease-in-out infinite; }
  #rot b { font-size:20px; color:var(--acc); }
  #rot span { font-size:14px; color:var(--mut); line-height:1.7; }
  #rot button { margin-top:12px; text-align:center; min-height:44px; }
  @keyframes rotHint { 0%,20% { transform:rotate(0deg); } 60%,100% { transform:rotate(-90deg); } }
  @media (orientation:portrait) { body.touch:not(.norot) #rot { display:flex; } }
  @media (prefers-reduced-motion:reduce) { #rot .ic { animation:none; } }
  #ov { --ovp:16px; position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,6,.78); padding:var(--ovp); overflow:auto; touch-action:pan-y; -webkit-user-select:text; user-select:text; }
  #ov > #panel { margin:auto; }
  #panel { --px:26px; --py:22px; width:600px; max-width:100%; background:rgba(14,20,16,.96); border:1px solid var(--line); border-radius:12px; padding:var(--py) var(--px); }
  #panel h1 { margin:0 0 2px; font-size:26px; letter-spacing:.14em; font-weight:700; color:var(--acc); }
  #panel h2 { margin:0 0 8px; font-size:21px; font-weight:700; }
  #panel .sub { color:var(--mut); font-size:13px; margin-bottom:12px; }
  #panel p { font-size:14px; line-height:1.7; margin:8px 0; color:#d5d9d0; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13px; margin:10px 0; }
  .k { color:var(--acc); font-weight:600; white-space:nowrap; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  button { background:#17231b; color:var(--ink); border:1px solid #4d7a5f; border-radius:8px; padding:11px 16px; font:inherit; font-size:14px; cursor:pointer; text-align:left; }
  button:hover { background:#1f3226; border-color:var(--acc); }
  button.big { font-size:16px; padding:12px 26px; border-color:var(--acc); color:var(--acc); }
  button small { display:block; color:var(--mut); font-size:12px; margin-top:3px; font-weight:400; }
  button.opt { flex:1 1 170px; }
  .chip { display:inline-block; padding:3px 10px; border:1px solid #4d7a5f; border-radius:999px; font-size:12px; margin:3px 5px 3px 0; color:#cfeee0; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; margin:8px 0; }
  .tbl td { padding:5px 8px; border-bottom:1px solid #26382c; }
  .good { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .rank { font-size:44px; font-weight:800; line-height:1; float:right; margin-left:12px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 6px; }
  button.tab { padding:7px 12px; font-size:13px; }
  button.tab.on { border-color:var(--acc); color:var(--acc); }
  .item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #26382c; }
  .item .d { font-size:13px; color:#c5cabf; margin-top:2px; }
  .item .c { font-size:12px; color:var(--mut); margin-top:3px; }
  button.dim { opacity:.5; }
  .note { color:var(--acc); font-size:13px; margin:6px 0; }
  .npc-say { display:flex; gap:12px; align-items:flex-end; margin:8px 0 10px; padding:8px 12px 8px 8px; background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.015)); border:1px solid #2e4636; border-left:4px solid var(--c, #7fe0b5); border-radius:12px; }
  .npc-say .pic { flex:0 0 auto; height:92px; width:auto; max-width:40vw; margin-top:-22px; object-fit:contain; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .npc-say .pic.obj { height:68px; margin-top:0; }
  .npc-say .tx { flex:1; min-width:0; padding-bottom:2px; }
  .npc-say b { display:block; font-size:15px; color:var(--c, #7fe0b5); }
  .npc-say .role { display:block; font-size:11px; color:var(--mut); margin-bottom:4px; }
  .npc-say p { margin:0; font-size:13px; line-height:1.5; color:#e9e7df; }
  #foot { height:var(--fh); display:flex; align-items:center; font-size:12px; color:var(--mut); text-align:center; white-space:nowrap; overflow:hidden; max-width:100vw; }
  /* touch + fullscreen */
  #t_fs, #t_pause { position:fixed; top:8px; z-index:20; width:40px; height:40px; padding:0; text-align:center; font-size:18px; border-radius:10px; background:rgba(14,20,16,.6); border-color:rgba(127,224,181,.4); }
  #t_fs { right:8px; } #t_pause { left:8px; display:none; }
  #touch { position:fixed; inset:0; z-index:15; pointer-events:none; display:none; --b:calc(clamp(48px, 10vmin, 84px) * var(--ts, 1)); touch-action:none; }
  body.touch #touch { display:block; } body.touch #t_pause { display:block; } body.touch #foot { display:none; } body.touch { --fh:0px; }
  body[data-mode="hub"] #touch, body[data-mode="decision"] #touch, body[data-mode="result"] #touch, body[data-mode="title"] #touch { display:none; }
  body[data-mode="playing"] .bf, body[data-mode="field"] .bb { display:none !important; }
  body[data-mode="village"] #touch .tb { display:none !important; } body[data-mode="village"] #touch #t_int { display:block !important; }
  #joy { position:absolute; left:4vmin; bottom:4vmin; width:calc(var(--b)*2.5*var(--k,1)); height:calc(var(--b)*2.5*var(--k,1)); border-radius:50%; background:rgba(127,224,181,.08); border:2px solid rgba(127,224,181,.35); pointer-events:auto; touch-action:none; }
  #joyKnob { position:absolute; left:50%; top:50%; width:44%; height:44%; margin:-22% 0 0 -22%; border-radius:50%; background:rgba(127,224,181,.35); border:2px solid rgba(127,224,181,.7); }
  .tb { position:absolute; pointer-events:auto; touch-action:none; width:calc(var(--b)*var(--k,1)); height:calc(var(--b)*var(--k,1)); padding:0; border-radius:50%; text-align:center; font-size:calc(var(--b)*.26*var(--k,1)); line-height:1.1; background:rgba(14,20,16,.55); border:2px solid rgba(127,224,181,.5); color:#e9f7ee; }
  .tb:active, .tb.on { background:rgba(127,224,181,.4); border-color:#7fe0b5; }
  #t_atk { right:2.5vmin; bottom:3.5vmin; width:calc(var(--b)*1.35*var(--k,1)); height:calc(var(--b)*1.35*var(--k,1)); font-size:calc(var(--b)*.34*var(--k,1)); border-color:#7fe0b5; }
  #t_dodge { right:calc(var(--b)*1.35 + 5vmin); bottom:2.5vmin; }
  #t_heavy { right:3vmin; bottom:calc(var(--b)*1.35 + 5vmin); }
  #t_block { right:calc(var(--b)*1.0 + 6vmin); bottom:calc(var(--b)*1.2 + 6vmin); width:calc(var(--b)*.85*var(--k,1)); height:calc(var(--b)*.85*var(--k,1)); }
  #side { position:absolute; inset:0; pointer-events:none; }
  #side .tb { width:calc(var(--b)*.9*var(--k,1)); height:calc(var(--b)*.9*var(--k,1)); font-size:calc(var(--b)*.22*var(--k,1)); }
  #touch { --sw:calc(var(--b)*.9 + 1.4vmin); }
  #t_scan { right:2vmin; bottom:calc(var(--b)*2.4 + 8vmin); }
  #t_dart, #t_sneak { right:2vmin; bottom:calc(var(--b)*2.4 + 8vmin + var(--sw)); }
  #t_heal, #t_int { right:2vmin; bottom:calc(var(--b)*2.4 + 8vmin + var(--sw)*2); }
  #t_load { right:calc(2vmin + var(--sw)); bottom:calc(var(--b)*2.4 + 8vmin + var(--sw)); }
  #t_bait { right:calc(2vmin + var(--sw)); bottom:calc(var(--b)*2.4 + 8vmin); }
  #t_snare { right:calc(2vmin + var(--sw)); bottom:calc(var(--b)*2.4 + 8vmin + var(--sw)); }
  #t_map { right:calc(2vmin + var(--sw)*2); bottom:calc(var(--b)*2.4 + 8vmin); }
  body[data-prac="1"][data-mode="playing"] #t_x { display:block !important; }
  #t_x { right:calc(2vmin + var(--sw)); bottom:calc(var(--b)*2.4 + 8vmin + var(--sw)*2); }
  #touch .tb, #touch #joy { opacity:var(--to, 1); }
  body.tedit #touch { display:block !important; } body.tedit #ov { display:none !important; }
  body.tedit[data-te="playing"] .bf, body.tedit[data-te="field"] .bb { display:none !important; }
  body.tedit #touch .tb, body.tedit #joy { outline:2px dashed rgba(255,214,102,.8); outline-offset:3px; cursor:grab; opacity:1; }
  body.tedit #touch .tb.sel, body.tedit #joy.sel { outline-color:#fff; background:rgba(255,214,102,.35); }
  #tedit { display:none; position:fixed; top:6px; left:50%; transform:translateX(-50%); z-index:40; gap:6px; flex-wrap:wrap; justify-content:center; max-width:94vw; padding:8px 10px; background:rgba(14,20,16,.92); border:1px solid var(--line); border-radius:12px; font-size:13px; align-items:center; }
  body.tedit #tedit { display:flex; } #tedit.tbot { top:auto; bottom:6px; } #tedit .gap { width:100%; height:0; }
  #tedit button { padding:6px 10px; font-size:12px; }
  #tedit { max-height:calc(100vh - 12px); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #te_exit { display:none; position:fixed; top:46%; left:max(8px, env(safe-area-inset-left)); transform:translateY(-50%); z-index:60; min-width:96px; min-height:46px; padding:8px 14px; font-size:15px; font-weight:700; border-radius:12px; border:2px solid #ffd666; background:rgba(14,20,16,.95); color:#ffd666; }
  body.tedit #te_exit { display:block; }
  #tskip { display:none; position:fixed; top:64px; left:8px; z-index:16; padding:6px 14px; font-size:12px; opacity:.85; background:rgba(14,20,16,.75); border:1px solid #4d7a5f; border-radius:16px; text-align:center; }
  @media (max-width:820px) { #panel { --px:16px; --py:14px; } #panel h1 { font-size:20px; } #panel h2 { font-size:17px; } #panel p, .grid, .tbl, .item .d { font-size:12px; } button { padding:8px 12px; font-size:13px; } button.big { font-size:14px; padding:9px 16px; } }
  /* v17.1 UX: แถบหัวแผงเมนูแบบกะทัดรัด (ติดขอบบนตอนเลื่อน) + เป้าสัมผัสใหญ่ขึ้น + จอเตี้ย (มือถือแนวนอน) */
  #panel .hdr-row { position:sticky; top:calc(-1 * var(--ovp)); z-index:5; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:calc(-1 * var(--py)) calc(-1 * var(--px)) 8px; padding:max(calc(var(--py) * .6), var(--ovp)) var(--px) 8px; background:rgba(14,20,16,.98); border-bottom:1px solid #26382c; border-radius:12px 12px 0 0; }
  #panel .hdr-t { font-size:15px; color:var(--acc); letter-spacing:.02em; white-space:nowrap; }
  #panel .hdr-sp { flex:1 1 8px; }
  #panel .hdr-s { color:var(--mut); font-size:12px; margin:0 0 8px; }
  #panel .hdr-row .bag-bar { flex-wrap:nowrap; } #panel .hdr-row .chip { margin:0; white-space:nowrap; }
  #panel .hdr-row button.tab { white-space:nowrap; }
  #panel img.hdr-av { width:34px; height:34px; border-radius:50%; object-fit:cover; object-position:50% 8%; border:2px solid #4d7a5f; background:#16261b; flex:none; }
  body.touch #panel button { min-height:42px; }
  body.touch #panel button.tab { min-height:38px; padding:6px 12px; }
  body.touch #panel .item button { min-height:40px; }
  @media (max-height:520px) {
    #ov { --ovp:6px; } #panel { --px:14px; --py:10px; }
    #panel h2 { font-size:15px; margin-bottom:4px; } #panel p { margin:5px 0; } #panel .sub { margin-bottom:6px; }
    .item { padding:7px 0; } .row { margin-top:9px; } .tabs { margin:6px 0 4px; }
    #panel img.hdr-av { display:none; }

/* แถวของ node ในสายพัฒนา: ไอคอน (ยังไม่รู้สูตร = เงาดำ · ใช้อยู่ = กรอบเขียว) + กล่องข้อความ */
function wtNodeOpen(n, own, past, known) {
  var st = 'flex:none;max-width:52px;object-fit:contain;border-radius:8px;' + (own ? 'outline:2px solid #7fe0b5;background:rgba(127,224,181,.1);' : '') + (!known ? 'filter:brightness(.1) contrast(.9);opacity:.6;' : (past ? 'opacity:.8;' : ''));
  return '<div style="display:flex;gap:10px;align-items:flex-start;margin-top:8px">' + uiImg('wup_' + n.id, 48, st) + '<div class="d" style="margin-top:0;flex:1;min-width:0">';
}
function wtreeHtml() {  var h = '<h2 style="font-size:15px;margin-top:14px">สายพัฒนาอาวุธ</h2><p style="font-size:12px;color:#9aa39a">แต่ละอาวุธแตกได้ 2 สาย ขั้น II ต้องมีชุดอาวุธ Mk.II · ขั้น III ต้องมี Mk.III และต่อจากสายเดิม · วัสดุมาจากมอนสเตอร์คนละตัวกัน · ล้างสายคืนวัสดุเต็มจำนวน เปลี่ยนสายได้ไม่เสียของ</p>';
  var spTh = { stag: 'กวาง', boar: 'หมูป่า', rabbit: 'กระต่าย', wolf: 'หมาป่า', hive: 'ราชินีรัง' };
  for (var i = 0; i < WEAPON_KEYS.length; i++) {
    var wk = WEAPON_KEYS[i], base = WEAPONS[wk];
    if (!ownsWeapon(wk)) continue;
    var cur = wnodeOf(wk);
    h += '<div class="item" style="display:block"><div><b>' + base.name + ' · ' + base.th + '</b> <span class="' + (cur ? 'good' : 'warn') + '">' + (cur ? 'สาย ' + cur.br + ' · ' + cur.name + ' (ขั้น ' + ['I', 'II', 'III'][cur.tier - 1] + ')' : 'ขั้น I (ยังไม่แตกสาย)') + '</span></div>';
    if (cur) h += '<div class="d">' + cur.desc + '</div><div><button class="tab" data-act="wtree" data-arg="reset:' + wk + '">ล้างสาย (คืนวัสดุเต็ม)</button></div>';
    var nodes = WTREE[wk];
    for (var j = 0; j < nodes.length; j++) {
      var n = nodes[j], own = cur && cur.id === n.id, past = cur && !own && cur.prev === n.id;
      var known = S.cleared[n.sp] >= 1 || own || past || (S.mats[SP_MATS[n.sp].common] || 0) > 0;
      var line = wtNodeOpen(n, own, past, known) + '<b>' + (known ? 'สาย ' + n.br + ' ขั้น ' + ['I', 'II', 'III'][n.tier - 1] + ' · ' + n.name + ' (' + n.th + ')' : 'สาย ' + n.br + ' ขั้น ' + ['I', 'II', 'III'][n.tier - 1] + ' · ???') + '</b>';
      if (!known) { h += line + ' — ต้องเคยจบงานกับ' + spTh[n.sp] + 'ก่อนถึงจะรู้สูตร</div></div>'; continue; }
      line += '<br>' + n.desc + '<br>';
      var right;
      if (own) right = '<span class="good">ใช้อยู่</span>';
      else if (past) right = '<span class="good">ผ่านแล้ว</span>';
      else if (n.tier === 2 && cur) right = '<span class="warn">ล้างสายก่อนจึงเปลี่ยนสายได้</span>';
      else if (n.tier === 3 && !(cur && cur.id === n.prev)) right = '<span class="warn">ต้องมีสาย ' + n.br + ' ขั้น II ก่อน</span>';
      else if (S.wk < n.tier) right = '<span class="warn">ต้องมีชุดอาวุธ Mk.' + ['I', 'II', 'III'][n.tier - 1] + ' ก่อน</span>';
      else { var okc = canAfford(n.cost); right = '<button data-act="wtree" data-arg="up:' + n.id + '" class="' + (okc ? '' : 'dim') + '">' + (okc ? 'พัฒนา' : 'วัสดุไม่พอ') + '</button>'; }
      var miss = []; for (var ck in n.cost) if ((S.mats[ck] || 0) < n.cost[ck]) miss.push(MATS[ck] + ' ขาด ' + (n.cost[ck] - (S.mats[ck] || 0)));

    }

  }
  return h;

}
