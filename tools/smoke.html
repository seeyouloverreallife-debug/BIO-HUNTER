<!doctype html><meta charset="utf-8"><title>Bio-Hunter smoke test</title>
<body style="background:#101814;color:#d5d9d0;font:13px/1.55 monospace;margin:10px">
<h3>Bio-Hunter · smoke test (เปิดผ่าน tools\serve.ps1: http://localhost:8123/tools/smoke.html)</h3>
<pre id="log">กำลังรัน…</pre>
<iframe id="g" src="../index.html" style="width:1280px;height:720px;border:1px solid #345;background:#000"></iframe>
<script>
(async function () {
  var log = [], fails = 0, errs = [], fr = document.getElementById('g');
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ok(name, cond, extra) { if (cond) log.push('PASS  ' + name); else { fails++; log.push('FAIL  ' + name + (extra !== undefined ? '  -> ' + extra : '')); } }
  async function T(name, fn) {
    var n0 = errs.length;
    try { await fn(); } catch (e) { fails++; log.push('FAIL  ' + name + '  EXCEPTION ' + (e && e.message || e)); return; }
    if (errs.length > n0) { fails++; log.push('FAIL  ' + name + '  runtime errors: ' + errs.slice(n0).join(' | ')); }
  }
  function finish() {
    log.push(''); log.push(fails ? 'RESULT: FAILED ' + fails + '  (พบปัญหา ' + fails + ' จุด)' : 'RESULT: ALL PASSED  (ผ่านทั้งหมด)');
    document.getElementById('log').textContent = log.join('\n');
    window.__smoke = { fails: fails, log: log, errs: errs };
  }
  // ---- wait for the game inside the iframe ----
  var w, b;
  for (var i = 0; i < 100; i++) { w = fr.contentWindow; if (w && w.__bh && w.BH_UI) break; await sleep(150); }
  if (!w || !w.__bh) { fails++; log.push('FAIL  boot: window.__bh not found'); return finish(); }
  b = w.__bh;
  w.addEventListener('error', function (e) { errs.push((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
  w.addEventListener('unhandledrejection', function (e) { errs.push('rejection ' + (e.reason && e.reason.message || e.reason)); });
  var ce = w.console.error; w.console.error = function () { errs.push('console.error ' + [].slice.call(arguments).join(' ')); ce.apply(w.console, arguments); };
  var K = b.keys, doc = w.document;
  var tclock = 1000;
  function drawFrames(n) { for (var q = 0; q < n; q++) { tclock += 16.7; b.frame(tclock); } }
  function frames(n, f) { for (var j = 0; j < n; j++) f(j); }
  await sleep(500);

  await T('boot', async function () {
    ok('version string', /^\d+\.\d+/.test(b.GAME_VER), b.GAME_VER);
    ok('BH_UI images >= 90', Object.keys(w.BH_UI).length >= 90, Object.keys(w.BH_UI).length);
    ok('BH_ART rigs >= 11', Object.keys(w.BH_ART || {}).length >= 11, Object.keys(w.BH_ART || {}).length);
    b.resetSave(); b.enterTitle(); await sleep(250);
    ok('title mode', b.state().mode === 'title', b.state().mode);
  });

  await T('village', async function () {
    b.enterVillage(''); drawFrames(12); await sleep(100);
    ok('village mode', b.state().mode === 'village', b.state().mode);
    var npcs = b.NPCS.slice();
    for (var i = 0; i < npcs.length; i++) {
      var n = npcs[i], v = b.VILL();
      v.V.x = n.x; v.V.y = Math.min(574, n.y + 34); v.update(0.016);
      v = b.VILL();
      ok('near ' + n.id, v.V.near && v.V.near.id === n.id, v.V.near && v.V.near.id);
      if (n.view) {
        v.interact(); await sleep(120);
        ok('talk ' + n.id + ' opens hub:' + n.view, b.state().mode === 'hub', b.state().mode);
        ok('dialogue card ' + n.id, !!doc.querySelector('.npc-say'));
        b.enterVillage(''); await sleep(80);
      } else { v.V.bubble = null; v.interact(); ok('bubble ' + n.id, !!b.VILL().V.bubble); }
    }
    ok('village portraits loaded', ['npc_bran', 'npc_child', 'vil_workshop', 'ally_stag'].every(function (k) { return !!w.BH_UI[k]; }));
  });

  await T('hub views', async function () {
    var views = ['main', 'board', 'garden', 'dojo', 'pen', 'forge', 'armor', 'lab', 'shop', 'skills', 'help', 'set', 'guide', 'bag', 'loadout', 'daily', 'chronicle', 'prep'];
    for (var i = 0; i < views.length; i++) {
      try { b.openHub(views[i]); drawFrames(2); await sleep(30); ok('hub ' + views[i], b.state().mode === 'hub' && doc.getElementById('panel').innerHTML.length > 150, b.state().mode); }
      catch (e) { fails++; log.push('FAIL  hub ' + views[i] + ' EXCEPTION ' + e.message); }
    }
  });

  await T('weapon upgrade icons', async function () {
    var nodes = b.WTREE_NODES, miss = nodes.filter(function (n) { return !w.BH_UI['wup_' + n.id]; }).map(function (n) { return n.id; });
    ok('icon exists for all ' + nodes.length + ' weapon nodes', nodes.length === 24 && miss.length === 0, miss.join(','));
    var S = b.save();
    S.wk = 3; S.res = S.res || {}; ['blades', 'maul', 'fangs'].forEach(function (k) { S.res['wp_' + k] = true; });
    S.cleared = S.cleared || {}; ['stag', 'boar', 'rabbit', 'wolf'].forEach(function (k) { S.cleared[k] = 2; });
    S.wt = { lance: 'lance_b1', blades: 'blades_c2' };
    b.openHub('forge'); drawFrames(2); await sleep(60);
    var imgs = [].slice.call(doc.querySelectorAll('#panel img.uimg')).map(function (i) { return i.getAttribute('src'); });
    ok('forge shows node icons (>= 24)', imgs.length >= 24, imgs.length);
    ok('lance list icon = Gore Lance (wup_lance_b1)', imgs.indexOf(w.BH_UI.wup_lance_b1.src) >= 0);
    ok('blades list icon = Nightstalker (wup_blades_c2)', imgs.indexOf(w.BH_UI.wup_blades_c2.src) >= 0);
    ok('no upgrade -> base icon (w_maul)', imgs.indexOf(w.BH_UI.w_maul.src) >= 0);
    b.openHub('bag'); drawFrames(1); await sleep(40);
    ok('bag gear shows upgraded icon', [].slice.call(doc.querySelectorAll('#panel img.uimg')).some(function (i) { return i.getAttribute('src') === w.BH_UI.wup_lance_b1.src; }));
    b.openHub('loadout'); drawFrames(1); await sleep(40);
    ok('loadout opens with upgraded weapon', b.state().mode === 'hub');
    b.ACTIONS.start(); drawFrames(10); await sleep(60);
    ok('battle HUD draws with weapon icon', b.state().mode === 'playing');
    b.enterVillage(''); drawFrames(3);
    S.wt = {};
  });
  await T('gear matters (v18.5)', async function () {
    var S = b.save(), M, P, bal = b.BAL;
    function begin(qid, wk, eqSet) {
      S.xp = 999999; S.wins = 20; S.qclear = {}; b.QUESTS.forEach(function (q) { S.qclear[q.id] = 1; });
      S.quest = qid; S.wk = wk; S.res = {}; S.eq = { head: '', chest: '', arms: '', legs: '' }; S.wt = {};
      if (eqSet) ['head', 'chest', 'arms', 'legs'].forEach(function (sl) { S.res['arm_' + eqSet + '_' + sl] = true; S.eq[sl] = eqSet; });
      b.ACTIONS.start(); drawFrames(2); M = b.state().M; P = b.state().P;
    }
    begin('q1_stag', 1, '');
    ok('tier 1 needs no weapon upgrade', M.tier === 1 && b.dullMul(M) === 1);
    begin('q2_stag', 1, '');
    ok('tier 2 with Mk.I: hide hardness -22%', M.tier === 2 && Math.abs(b.dullMul(M) - bal.dull) < 1e-9, M.tier + ' / ' + b.dullMul(M));
    begin('q2_stag', 2, '');
    ok('tier 2 with Mk.II: full damage', b.dullMul(M) === 1);
    begin('q3_boar', 2, '');
    ok('tier 3 with Mk.II: -22%, with Mk.I: -39%', M.tier === 3 && Math.abs(b.dullMul(M) - bal.dull) < 1e-9);
    S.wk = 1; ok('tier 3 with Mk.I', Math.abs(b.dullMul(M) - Math.pow(bal.dull, 2)) < 1e-9);
    begin('q3_stag', 3, '');
    var g = bal.tier[3].grace * bal.graceDiff[S.set ? Math.round(+S.set.diff) : 1];
    M.fightT = g - 1; ok('no rage before the grace time', b.rageN(M) === 0);
    M.fightT = g + 1; ok('rage x1 after grace', b.rageN(M) === 1);
    M.fightT = g + 500; ok('rage capped at max', b.rageN(M) === bal.rageMax);
    M.cured = true; ok('cured monster calms down', b.rageN(M) === 0); M.cured = false;
    begin('q3_stag', 3, '');
    var hpBase = P.maxHp, drBase = b.armorTaken();
    ok('no armor: no damage reduction', drBase === 1, drBase);
    begin('q3_stag', 3, 'hide');
    ok('full hide set adds HP (+16)', P.maxHp - hpBase === 16, P.maxHp + ' vs ' + hpBase);
    ok('full hide set cuts damage by 26.4%', Math.abs((1 - b.armorTaken()) - .264) < .001, b.armorTaken());
    begin('q3_stag', 3, 'alpha');
    ok('best set cuts damage by ~35% (floor .35)', b.armorTaken() <= .66 && b.armorTaken() >= .35, b.armorTaken());
    S.quest = ''; S.wk = 1; S.res = {}; S.eq = { head: '', chest: '', arms: '', legs: '' }; S.xp = 0; S.wins = 0; S.qclear = {}; b.enterVillage(''); drawFrames(3);
  });
  await T('multi-map ecosystem', async function () {
    var S = b.save(), P, M, F, j, names = { stag: 'Sunken Grove', boar: 'Thornback Ridge', rabbit: 'Burrow Meadow' };
    S.wins = 3; S.hunts = 10; S.eco = {}; S.forest = { stag: 60, boar: 60, rabbit: 60 };
    function blocked(x, y, rad) { return b.HAB.trees.concat(b.HAB.frocks).some(function (o) { return Math.hypot(o.x - x, o.y - y) < o.r + rad; }); }
    function pickAll(list) {
      var got = 0;
      list.forEach(function (s) {
        M.x = b.WW - 150; M.y = 140; P.x = s.x; P.y = s.y; F.aw = 0; K.f = true;
        for (var q = 0; q < Math.ceil(s.t * 60) + 20 && b.state().mode === 'field'; q++) { M.x = b.WW - 150; M.y = 140; F.aw = 0; b.fieldStep(1 / 60); }
        K.f = false; if (F.done[s.id]) got++;
      });
      return got;
    }
    var regions = ['stag', 'boar', 'rabbit'];
    for (var rx = 0; rx < regions.length; rx++) {
      var r = regions[rx];
      S.quest = ''; b.ACTIONS.target(r); b.ACTIONS.explore(); drawFrames(6); await sleep(40);
      F = b.FIELD(); P = b.state().P; M = b.state().M;
      ok('map ' + r + ' = ' + names[r], b.MAPKEY === r && b.MAP.name === names[r] && F && F.region === r, b.MAPKEY);
      ok('map ' + r + ' world size', b.WW === b.MAP.w && b.WH === b.MAP.h && b.fieldBg().width === b.WW && b.fieldBg().height === b.WH);
      ok('map ' + r + ' has 4 camps + 18+ signs incl. tracks and dung', b.CAMPS.length === 4 && b.SIGNS.length >= 18 && b.SIGNS.some(function (s) { return s.id === 'dung'; }) && b.SIGNS.some(function (s) { return s.id === 'tracks'; }), b.SIGNS.length);
      ok('map ' + r + ' start/camps/signs are not inside obstacles', !blocked(P.x, P.y, 10) && !b.CAMPS.some(function (c) { return blocked(c.x, c.y, 10); }) && !b.SIGNS.some(function (s) { return blocked(s.x, s.y, 6); }));
      for (j = 0; j < 90 * 60 && b.state().mode === 'field'; j++) { P.x = b.CAMPS[0].x + 36; P.y = b.CAMPS[0].y + 24; F.aw = 0; b.fieldStep(1 / 60); }
      ok('map ' + r + ' monster routine runs 90 s inside the world', b.state().mode === 'field' && M.x > 0 && M.x < b.WW && M.y > 0 && M.y < b.WH, Math.round(M.x) + ',' + Math.round(M.y));
      drawFrames(8);
    }
    /* ผู้บุกรุก (หมาป่า/ราชินีรัง) ไปเขตที่ป่าอ่อนแอที่สุด */
    S.forest = { stag: 70, boar: 30, rabbit: 55 };
    ok('wolf + hive go to the weakest region', b.regionFor('wolf') === 'boar' && b.regionFor('hive') === 'boar', b.regionFor('wolf'));
    S.forest = { stag: 70, boar: 50, rabbit: 20 };
    ok('invaders follow the weakest region', b.regionFor('hive') === 'rabbit' && b.regionFor('wolf') === 'rabbit');
    ok('species keep their own region', b.regionFor('stag') === 'stag' && b.regionFor('boar') === 'boar' && b.regionFor('rabbit') === 'rabbit' && b.regionFor('fawn') === 'stag');
    /* พืช/หนังงอกใหม่ตามสุขภาพป่า */
    S.forest = { stag: 80, boar: 40, rabbit: 40 }; S.eco = {}; S.hunts = 20;
    ok('regrow time by forest health', b.ecoRegrow('stag') === 1 && b.ecoRegrow('boar') === 2 && b.ecoRegrow('rabbit') === 2);
    S.quest = ''; b.ACTIONS.target('stag'); b.ACTIONS.explore(); drawFrames(3);
    F = b.FIELD(); P = b.state().P; M = b.state().M;
    var plants = b.SIGNS.filter(function (s) { return /^(plant_|shed)/.test(s.id); });
    ok('all pickable signs offered in a fresh region', plants.length === 15, plants.length);
    var got = pickAll(plants);
    ok('picked all ' + plants.length + ' plants/hides', got === plants.length, got);
    ok('picks recorded in S.eco.stag.picked', Object.keys(b.ecoOf('stag').picked).length === plants.length);
    S.hunts = 21; b.ACTIONS.explore(); drawFrames(2); F = b.FIELD();
    ok('forest 80%: everything regrown after 1 hunt', F.held === 0 && b.SIGNS.length === 21, F.held + ' held / ' + b.SIGNS.length);
    S.forest.stag = 20; S.eco = {}; S.hunts = 30; b.ACTIONS.explore(); drawFrames(2); F = b.FIELD(); P = b.state().P; M = b.state().M;
    ok('sick forest (20%): regrow 3 hunts + 3 spore patches + wider hazard', b.ecoRegrow('stag') === 3 && F.patches.length === 3 && F.hz > 1.15, b.ecoRegrow('stag') + ' / ' + F.patches.length + ' / ' + F.hz);
    pickAll(b.SIGNS.filter(function (s) { return /^(plant_|shed)/.test(s.id); }));
    S.hunts = 31; b.ACTIONS.explore(); drawFrames(2); F = b.FIELD();
    var kinds = {};
    b.SIGNS.filter(function (s) { return /^plant_/.test(s.id); }).forEach(function (s) { kinds[s.id.split('_')[1].replace(/\d+$/, '')] = 1; });
    ok('sick forest: picked spots stay empty but each herb kind + hide keeps one', F.held > 0 && Object.keys(kinds).length === 4 && b.SIGNS.some(function (s) { return /^shed/.test(s.id); }), F.held + ' held, kinds=' + Object.keys(kinds).join(','));
    S.hunts = 33; b.ACTIONS.explore(); drawFrames(2); F = b.FIELD();
    ok('after 3 hunts the sick forest regrows too', F.held === 0, F.held);
    drawFrames(6);
    /* รีเซ็ตให้ชุดทดสอบถัดไป */
    S.eco = {}; S.wins = 0; S.hunts = 0; S.forest = { stag: 40, boar: 40, rabbit: 40 }; S.quest = ''; b.ACTIONS.target('stag'); b.enterVillage(''); drawFrames(3);
  });

  await T('invader hunt affects its own region', async function () {
    var S = b.save();
    S.xp = 20000; S.wins = 5; S.hunts = 8; S.qclear = { q1_stag: 1, q1_boar: 1, q2_stag: 1, q2_boar: 1 }; S.eco = {};
    S.forest = { stag: 70, boar: 30, rabbit: 55 };
    S.quest = 'q2_wolf'; b.ACTIONS.explore(); drawFrames(4);
    var F = b.FIELD();
    ok('wolf quest opens the weakest region map (boar)', F && F.region === 'boar' && b.MAPKEY === 'boar' && b.huntRegionKey() === 'boar', F && F.region);
    var P = b.state().P, M = b.state().M;
    P.x = M.x - 12; P.y = M.y; F.aw = 1.1; b.fieldStep(1 / 60); drawFrames(4);
    ok('encounter in that region', b.state().mode === 'playing' && b.huntRegionKey() === 'boar', b.state().mode);
    b.finish('treat_full'); await sleep(120);
    ok('success: weakest region +6, others +1', S.forest.boar === 36 && S.forest.stag === 71 && S.forest.rabbit === 56, JSON.stringify(S.forest));
    S.quest = ''; S.qclear = {}; S.xp = 0; S.wins = 0; S.hunts = 0; S.forest = { stag: 40, boar: 40, rabbit: 40 }; b.ACTIONS.target('stag'); b.enterVillage(''); drawFrames(3);
  });

  await T('village with pen + ally', async function () {
    var S = b.save();
    S.pen = [{ kind: 'stag', cond: 80, vr: 0, dx: 1, ail: 'infection', last: 0 }, { kind: 'boar', cond: 40, vr: 0, last: 0 }, { kind: 'rabbit', cond: 15, vr: 0, last: 0 }];
    S.allies = [{ id: 'a1', kind: 'rabbit', mut: true, sev: false, bond: 3, name: 'ใบไม้' }]; S.ally = 0;
    S.forest = S.forest || {}; S.forest.stag = 95; S.forest.boar = 80; S.forest.rabbit = 60;
    b.enterVillage(''); drawFrames(25); await sleep(100);
    ok('village still running', b.state().mode === 'village');
  });

  await T('field: camps / signs / map', async function () {
    b.ACTIONS.explore(); drawFrames(12); await sleep(100);
    var F = b.FIELD(), P = b.state().P, M = b.state().M;
    ok('field mode', b.state().mode === 'field' && !!F, b.state().mode);
    frames(300, function () { b.fieldStep(1 / 60); });
    ok('field time advances', F.t > 4, F.t);
    ok('world size', b.WW >= 2000 && b.WH >= 1200, b.WW + 'x' + b.WH);
    ok('camps + signs defined', b.CAMPS.length === 4 && b.SIGNS.length >= 20, b.CAMPS.length + '/' + b.SIGNS.length);
    // camp menu: rest + travel
    P.x = b.CAMPS[0].x + 30; P.y = b.CAMPS[0].y + 20; F.aw = 0; b.fieldStep(1 / 60);
    K.f = true; b.fieldStep(1 / 60); K.f = false; b.fieldStep(1 / 60);
    ok('camp menu opens with F', F.campMenu === 0, F.campMenu);
    drawFrames(5); await sleep(50);
    F.campSeen = [true, true, true, true];
    K['2'] = true; b.fieldStep(1 / 60); K['2'] = false;
    ok('camp fast travel moved player', Math.hypot(P.x - b.CAMPS[0].x, P.y - b.CAMPS[0].y) > 400 && F.campMenu === -1, Math.round(P.x) + ',' + Math.round(P.y));
    // every sign can be collected, tracks start the glowing trail
    var done = 0;
    for (var i = 0; i < b.SIGNS.length; i++) {
      var s = b.SIGNS[i];
      if (b.state().mode !== 'field') break;
      M.x = b.WW - 150; M.y = 140; P.x = s.x; P.y = s.y; F.aw = 0; K.f = true;
      for (var j = 0; j < Math.ceil(s.t * 60) + 20 && b.state().mode === 'field'; j++) { M.x = b.WW - 150; M.y = 140; F.aw = 0; b.fieldStep(1 / 60); }
      K.f = false;
      if (F.done[s.id]) done++;
    }
    ok('all signs collected (' + done + '/' + b.SIGNS.length + ')', done === b.SIGNS.length, done);
    ok('footprint trail active after tracks', F.trailT > 0, F.trailT);
    drawFrames(6); F.mapOpen = true; drawFrames(6); F.mapOpen = false; drawFrames(3);
    ok('full map toggled without error', true);
  });

  await T('encounter -> battle', async function () {
    var F = b.FIELD(), P = b.state().P, M = b.state().M;
    if (!F) { b.ACTIONS.explore(); await sleep(100); F = b.FIELD(); P = b.state().P; M = b.state().M; }
    P.x = M.x - 12; P.y = M.y; F.aw = 1.1; b.fieldStep(1 / 60);
    ok('noticed -> battle', b.state().mode === 'playing', b.state().mode);
  });

  await T('battle sim', async function () {
    var P = b.state().P, M = b.state().M, bad = '';
    P.maxHp = P.hp = 1e9;
    for (var f = 0; f < 1500; f++) {
      K.d = (f % 90) < 45; K.a = !K.d; K.w = (f % 140) < 30; K.s = false; K.j = (f % 25) < 6; K.k = (f % 300) > 270; K.space = (f % 70) === 0;
      tclock += 16.7; b.frame(tclock);
      if (!isFinite(P.x) || !isFinite(P.y) || !isFinite(M.hp) || !isFinite(M.x)) { bad = 'NaN at frame ' + f; break; }
      if (b.state().mode !== 'playing') break;
    }
    K.d = K.a = K.w = K.s = K.j = K.k = K.space = false;
    ok('no NaN in 1500 frames', !bad, bad);
    ok('battle progressed (monster hurt or phase)', M.hp < M.maxHp || M.phase > 1, M.hp + '/' + M.maxHp);
  });

  await T('finish + result', async function () {
    if (b.state().mode !== 'playing') { b.ACTIONS.start(); await sleep(150); }
    b.monsterDowned(); b.openDecision(); await sleep(150);
    ok('decision mode', b.state().mode === 'decision', b.state().mode);
    b.finish('eliminate'); await sleep(250);
    ok('result mode', b.state().mode === 'result', b.state().mode);
    b.enterVillage(''); await sleep(200);
    ok('back to village', b.state().mode === 'village', b.state().mode);
  });

  await T('service worker files', async function () {
    // every file in sw.js CORE must exist, otherwise cache.addAll() fails and the PWA never installs
    var src = await (await fetch('../sw.js', { cache: 'no-store' })).text();
    var m = /const CORE = \[([^\]]*)\]/.exec(src);
    ok('sw.js has a CORE list', !!m);
    var list = m ? m[1].split(',').map(function (s) { return s.trim().replace(/^'|'$/g, ''); }).filter(Boolean) : [];
    var missing = [];
    for (var i = 0; i < list.length; i++) { var r = await fetch('../' + (list[i] === './' ? 'index.html' : list[i]), { cache: 'no-store' }); if (!r.ok) missing.push(list[i]); }
    ok('all ' + list.length + ' precache files exist', missing.length === 0, missing.join(','));
    ok('CORE includes art/art.js + art/ui.js', list.indexOf('art/art.js') >= 0 && list.indexOf('art/ui.js') >= 0, list.join(','));
    var ver = /const VERSION = '([^']+)'/.exec(src);
    ok('sw VERSION matches game version', ver && ver[1] === 'bh-' + b.GAME_VER, (ver && ver[1]) + ' vs ' + b.GAME_VER);
  });

  await T('service worker runtime (informational)', async function () {
    function timeout(p, ms) { return Promise.race([p, new Promise(function (r) { setTimeout(function () { r('__timeout'); }, ms); })]); }
    var sw = w.navigator.serviceWorker;
    if (!sw || !w.caches) { log.push('SKIP  service worker / cache API not available in this browser'); return; }
    var reg = await timeout(sw.getRegistration(), 3000), names = [];
    for (var k = 0; k < 30 && reg && reg !== '__timeout'; k++) { names = await timeout(w.caches.keys(), 1500); if (names === '__timeout') { names = []; break; } if (names.length) break; await sleep(100); }
