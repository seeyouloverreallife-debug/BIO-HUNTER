<!doctype html><meta charset="utf-8"><title>Bio-Hunter · ตรวจไวยากรณ์ src/js</title>
<body style="background:#101814;color:#d5d9d0;font:13px/1.5 monospace;margin:12px">
<h3>ตรวจไวยากรณ์ของแต่ละส่วนใน src/js (แยกกัน + ต่อกันทั้งหมด)</h3>
<pre id="log">กำลังตรวจ…</pre>
<script>
(async function () {
  var out = [], bad = 0, names = await (await fetch('../src/js/_parts.json', { cache: 'no-store' })).json(), all = '';
  for (var i = 0; i < names.length; i++) {
    var t = await (await fetch('../src/js/' + names[i], { cache: 'no-store' })).text();
    all += t;
    try { new Function('"use strict";\n' + t); out.push('OK    ' + names[i] + '  (' + t.split('\n').length + ' บรรทัด)'); }
    catch (e) { bad++; out.push('FAIL  ' + names[i] + '  ' + e.message); }
  }
  try { new Function('"use strict";\n' + all); out.push('OK    ทั้งหมดต่อกัน (' + all.length + ' ตัวอักษร)'); } catch (e) { bad++; out.push('FAIL  ทั้งหมดต่อกัน ' + e.message); }
  document.getElementById('log').textContent = out.join('\n') + '\n\n' + (bad ? 'พบปัญหา ' + bad + ' จุด' : 'ผ่านทั้งหมด');
  window.__result = { bad: bad, lines: out };
})();
</script>
