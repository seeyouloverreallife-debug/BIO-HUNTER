<!doctype html><meta charset="utf-8"><title>Bio-Hunter smoke test (touch)</title>
<body style="background:#101814;color:#d5d9d0;font:13px/1.55 monospace;margin:10px">
<h3>Bio-Hunter · smoke test จอสัมผัส 740×360 (ต้องเปิดแบบเปิด touch events — tools\smoke.ps1 จัดให้เอง)</h3>
<pre id="log">กำลังรัน…</pre>
<iframe id="g" src="../index.html" style="width:740px;height:360px;border:1px solid #345;background:#000"></iframe>
<script>
(async function () {
  var log = [], fails = 0, errs = [], fr = document.getElementById('g');
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ok(name, cond, extra) { if (cond) log.push('PASS  ' + name); else { fails++; log.push('FAIL  ' + name + (extra !== undefined ? '  -> ' + extra : '')); } }
  async function T(name, fn) {
    var n0 = errs.length;
    try { await fn(); } catch (e) { fails++; log.push('FAIL  ' + name + '  EXCEPTION ' + (e && e.message || e)); return; }
    if (errs.length > n0) { fails++; log.push('FAIL  ' + name + '  runtime errors: ' + errs.slice(n0).join(' | ')); }
  }
  function finish() {
    log.push(''); log.push(fails ? 'RESULT: FAILED ' + fails + '  (พบปัญหา ' + fails + ' จุด)' : 'RESULT: ALL PASSED  (ผ่านทั้งหมด)');
    document.getElementById('log').textContent = log.join('\n');
    window.__smoke = { fails: fails, log: log, errs: errs };
  }
  var w, b;
  for (var i = 0; i < 100; i++) { w = fr.contentWindow; if (w && w.__bh && w.BH_UI) break; await sleep(150); }
  if (!w || !w.__bh) { fails++; log.push('FAIL  boot: window.__bh not found'); return finish(); }
  b = w.__bh;
  w.addEventListener('error', function (e) { errs.push((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
  w.addEventListener('unhandledrejection', function (e) { errs.push('rejection ' + (e.reason && e.reason.message || e.reason)); });
  var ce = w.console.error; w.console.error = function () { errs.push('console.error ' + [].slice.call(arguments).join(' ')); ce.apply(w.console, arguments); };
  var K = b.keys, doc = w.document;
  var tclock = 1000;
  function drawFrames(n) { for (var q = 0; q < n; q++) { tclock += 16.7; b.frame(tclock); } }
  await sleep(500);

  function $(id) { return doc.getElementById(id); }
  function visible(id) { var e = $(id); if (!e) return false; var r = e.getBoundingClientRect(); return r.width > 4 && r.height > 4 && w.getComputedStyle(e).display !== 'none'; }
  function ptr(el, type, x, y, id) {
    var ev = new w.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id || 7, pointerType: 'touch', isPrimary: true, clientX: x, clientY: y });
    el.dispatchEvent(ev);
  }
  function center(el) { var r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  function tapBtn(id) { var c = center($(id)); ptr($(id), 'pointerdown', c[0], c[1], 11); }
  function releaseBtn(id) { var c = center($(id)); ptr($(id), 'pointerup', c[0], c[1], 11); }
  function canvasClientXY(cx, cy) { var v = b.VIEW(), r = $('game').getBoundingClientRect(); return [r.left + cx * r.width / v.VW, r.top + cy * r.height / v.H]; }
  function canvasTap(cx, cy) { var p = canvasClientXY(cx, cy); ptr($('game'), 'pointerdown', p[0], p[1], 21); ptr($('game'), 'pointerup', p[0], p[1], 21); }

  await T('touch environment', async function () {
    var v = b.VIEW();
    ok('isTouch detected', v.isTouch === true, String(v.isTouch));
    ok('body.touch class', doc.body.classList.contains('touch'));
    ok('viewport is phone landscape', w.innerWidth === 740 && w.innerHeight === 360, w.innerWidth + 'x' + w.innerHeight);
    ok('HUD scaled up for small screen (HK > 1)', v.HK > 1.05, v.HK);
  });

  await T('village controls', async function () {
    b.resetSave(); b.enterVillage(''); drawFrames(6); await sleep(100);
    ok('village mode', b.state().mode === 'village');
    ok('interact button visible', visible('t_int'));
    ok('joystick visible', visible('joy'));
    ok('battle buttons hidden in village', !visible('t_atk') && !visible('t_dodge'));
    // joystick drives the player
    var V = b.VILL().V; V.x = 480; V.y = 330; var x0 = V.x;
    var jc = center($('joy')), jr = $('joy').getBoundingClientRect();
    ptr($('joy'), 'pointerdown', jc[0] + jr.width * .45, jc[1], 31);
    ok('joystick -> key d', K.d === true);
    for (var f = 0; f < 40; f++) b.VILL().update(1 / 60);
    ptr($('joy'), 'pointerup', jc[0], jc[1], 31);
    ok('player moved right', b.VILL().V.x > x0 + 30, x0 + ' -> ' + b.VILL().V.x);
    ok('joystick released', !K.d);
    // talk to the smith with the interact button
    var smith = b.NPCS.filter(function (n) { return n.id === 'smith'; })[0];
    V = b.VILL().V; V.x = smith.x; V.y = smith.y + 34; b.VILL().update(0.016);
    tapBtn('t_int'); await sleep(150); releaseBtn('t_int');
    ok('t_int opens smith hub', b.state().mode === 'hub', b.state().mode);
    ok('dialogue card on phone', !!doc.querySelector('.npc-say'));
    var card = doc.querySelector('.npc-say'), pr = doc.getElementById('panel').getBoundingClientRect(), cr = card && card.getBoundingClientRect();
    ok('card fits inside panel width', cr && cr.right <= pr.right + 1 && cr.left >= pr.left - 1, cr && (cr.left + '..' + cr.right + ' vs ' + pr.left + '..' + pr.right));
  });

  await T('field controls', async function () {
    b.enterVillage(''); await sleep(100);
    b.ACTIONS.explore(); drawFrames(8); await sleep(100);
    var F = b.FIELD(), P = b.state().P;
    ok('field mode', b.state().mode === 'field' && !!F);
    ok('map + interact + sneak buttons visible', visible('t_map') && visible('t_int') && visible('t_sneak'));
    ok('minimap rect on screen', F.mmRect && F.mmRect.x >= 0 && F.mmRect.y >= 0, JSON.stringify(F.mmRect));
    // full map via button, closed by tapping the screen
    tapBtn('t_map'); await sleep(80); releaseBtn('t_map');
    ok('t_map opens full map', F.mapOpen === true);
    drawFrames(4);
    canvasTap(200, 200); await sleep(60);
    ok('tap closes full map', F.mapOpen === false);
    // minimap tap opens the map
    var mm = F.mmRect, v = b.VIEW();
    canvasTap(mm.x + mm.w / 2, mm.y + mm.h / 2); /* mmRect อยู่ในพิกัดแคนวาส (รวม OFFX แล้ว) */ await sleep(60);
    ok('minimap tap opens full map', F.mapOpen === true);
    canvasTap(200, 200); await sleep(60);
    // camp menu: open with the interact button, choose by tapping
    F.mapOpen = false;
    P.x = b.CAMPS[0].x + 30; P.y = b.CAMPS[0].y + 20; F.aw = 0; P.hp = P.maxHp - 25; F.hpLoss = 25;
    for (var f = 0; f < 5; f++) b.fieldStep(1 / 60);
    tapBtn('t_int'); b.fieldStep(1 / 60); releaseBtn('t_int'); b.fieldStep(1 / 60);
    ok('camp menu opens from touch button', F.campMenu === 0, F.campMenu);
    drawFrames(4);
    ok('camp rows laid out', F.cmRects && F.cmRects.length >= 2, F.cmRects && F.cmRects.length);
    if (F.cmRects && F.cmRects.length) {
      var r0 = F.cmRects[0];
      canvasTap(r0.x + r0.w / 2, r0.y + r0.h / 2); await sleep(60);
      ok('tapping Rest heals and closes', F.campMenu === -1 && P.hp >= P.maxHp - .5, F.campMenu + ' hp=' + P.hp);
    }
  });

  await T('battle controls', async function () {
    var F = b.FIELD(), P, M;
    if (F) { b.state().P.x = b.state().M.x - 12; b.state().P.y = b.state().M.y; F.aw = 1.1; b.fieldStep(1 / 60); }
    else { b.ACTIONS.start(); await sleep(150); }
    drawFrames(5);
    P = b.state().P; M = b.state().M; P.maxHp = P.hp = 1e9;
    ok('battle mode', b.state().mode === 'playing', b.state().mode);
    ok('attack + dodge buttons visible', visible('t_atk') && visible('t_dodge') && visible('t_heavy'));
    var x0 = P.x, jc = center($('joy')), jr = $('joy').getBoundingClientRect();
    ptr($('joy'), 'pointerdown', jc[0] + jr.width * .45, jc[1], 41);
    for (var f = 0; f < 60; f++) b.step(1 / 60);
    ptr($('joy'), 'pointerup', jc[0], jc[1], 41);
    ok('joystick moves player in battle', Math.abs(P.x - x0) > 20, x0 + ' -> ' + P.x);
    tapBtn('t_atk'); ok('attack button holds key j', K.j === true); b.step(1 / 60); releaseBtn('t_atk');
    ok('attack button releases key j', !K.j);
    tapBtn('t_dodge'); b.step(1 / 60); releaseBtn('t_dodge');
    ok('state still finite', isFinite(P.x) && isFinite(P.hp) && isFinite(M.hp));
  });

  await T('portrait overlay', async function () {
    fr.style.width = '375px'; fr.style.height = '740px'; await sleep(450);
    var rot = $('rot');
    ok('rotate overlay shows in portrait', rot && w.getComputedStyle(rot).display !== 'none', rot && w.getComputedStyle(rot).display);
    var go = $('rot_go'); if (go) go.click(); await sleep(150);
    ok('"play anyway" hides overlay', w.getComputedStyle(rot).display === 'none', w.getComputedStyle(rot).display);
    doc.body.classList.remove('norot');
    fr.style.width = '740px'; fr.style.height = '360px'; await sleep(350);
    ok('overlay gone back in landscape', w.getComputedStyle(rot).display === 'none');
  });

  await T('cleanup', async function () {
    ['bio-hunter-warden-v3', 'bio-hunter-warden-v3-backup', 'bio-hunter-pt-v1', 'bio-hunter-ui-v2'].forEach(function (k) { try { w.localStorage.removeItem(k); } catch (e) {} });
    ok('test save cleared', true);
  });
  finish();
})();
</script>
