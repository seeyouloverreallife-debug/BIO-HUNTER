<!doctype html><html lang="th"><meta charset="utf-8"><title>BIO HUNTER — ตรวจบ่อน้ำ</title>
<style>body{background:#132419;color:#efdfbf;font:15px Tahoma;margin:12px}button,select{font:inherit;padding:8px;margin:4px;background:#344c36;color:white;border:1px solid #789c80;border-radius:6px}iframe{display:block;border:0;width:1280px;height:720px;margin:10px 0}#old{position:absolute;left:-5000px;top:0}pre{white-space:pre-wrap}</style>
<h2>BIO HUNTER v18.6.1 — ผิวน้ำและขอบบ่อ</h2>
<select id="region" aria-label="เขตป่า"><option>stag</option><option>boar</option><option>rabbit</option></select>
<button id="pond">ดูบ่อน้ำ</button><select id="size" aria-label="ขนาดจอ"><option value="desktop">จอใหญ่ 1280×720</option><option value="touch">จอสัมผัส 740×360</option></select><button id="check">เทียบกับ v18.6</button>
<iframe id="g" title="เกมฉบับแก้บ่อน้ำ" src="../index.art-review.html"></iframe>
<iframe id="old" title="เกมฉบับอ้างอิง" src="../../bio-hunter-v18.6/index.html"></iframe><pre id="log">กำลังโหลดภาพ…</pre>
<script>
var fr=document.getElementById('g'),old=document.getElementById('old'),b,ob,w,logs=[],failed=0,checked=0;
function ok(name,value){checked++;if(!value)failed++;logs.push((value?'PASS ':'FAIL ')+name);document.getElementById('log').textContent=logs.join('\n')}
function pond(){var key=document.getElementById('region').value,S=b.save();S.wins=20;S.xp=999999;S.quest='';b.ACTIONS.target(key);b.ACTIONS.explore();var s=b.state(),site=b.SITES.water;s.P.x=site.x;s.P.y=site.y+20;s.P.face=-Math.PI/2;b.draw();}
function compare(){logs=[];failed=0;checked=0;ok('27 patched images loaded',b.visual().loaded.length===27);ok('24 baseline images loaded',ob.visual().loaded.length===24);
 for(var key of ['stag','boar','rabbit']){
   b.loadMap(key==='stag'?'boar':'stag');ob.loadMap(key==='stag'?'boar':'stag');b.loadMap(key);ob.loadMap(key);
   var site=b.SITES.water,os=ob.SITES.water;ok(key+' water geometry unchanged',JSON.stringify(site)===JSON.stringify(os));
   ok(key+' obstacle geometry unchanged',JSON.stringify(b.HAB)===JSON.stringify(ob.HAB));
   var canvas=b.fieldBg(),oc=ob.fieldBg();ok(key+' background dimensions unchanged',canvas.width===oc.width&&canvas.height===oc.height);
   var a=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,z=oc.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,different=0,changedWater=0;
   var x0=Math.floor(site.x-site.rx-26),x1=Math.ceil(site.x+site.rx+26),y0=Math.floor(site.y-site.ry-22),y1=Math.ceil(site.y+site.ry+22);
   for(var y=0;y<canvas.height;y++)for(var x=0;x<canvas.width;x++){var i=(y*canvas.width+x)*4,changed=a[i]!==z[i]||a[i+1]!==z[i+1]||a[i+2]!==z[i+2]||a[i+3]!==z[i+3];if(changed){if(x>=x0&&x<x1&&y>=y0&&y<y1)changedWater++;else different++;}}
   ok(key+' no changed pixels outside water rectangle',different===0);ok(key+' water pixels replaced',changedWater>10000);
   ok(key+' painted shoreline drawn',b.visual().draws['fld_water_'+key]>0);
 }
 logs.push(failed?'RESULT: FAILED '+failed:'RESULT: ALL PASSED ('+checked+' checks)');document.getElementById('log').textContent=logs.join('\n');window.__waterCheck={checks:checked,failed:failed,log:logs};pond();
}
async function bind(){for(var i=0;i<150;i++){w=fr.contentWindow;if(w&&w.__bh&&w.__bh.visual().loaded.length===27)break;await new Promise(function(r){setTimeout(r,100)})}b=w.__bh;document.getElementById('pond').onclick=pond;document.getElementById('pond').disabled=false;pond();}
document.getElementById('size').onchange=function(){var touch=this.value==='touch';fr.style.width=touch?'740px':'1280px';fr.style.height=touch?'360px':'720px';document.getElementById('pond').disabled=true;fr.addEventListener('load',function(){bind();},{once:true});fr.src=touch?'../index.touch-review.html':'../index.art-review.html';};
async function boot(){await bind();for(var i=0;i<150;i++){if(old.contentWindow.__bh&&old.contentWindow.__bh.visual().loaded.length===24)break;await new Promise(function(r){setTimeout(r,100)})}ob=old.contentWindow.__bh;document.getElementById('check').onclick=compare;compare();}
boot();
</script></html>
