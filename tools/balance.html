<!doctype html><meta charset="utf-8"><title>Bio-Hunter balance bot</title>
<body style="background:#101814;color:#d5d9d0;font:12px/1.5 monospace;margin:10px">
<h3>Bio-Hunter · balance bot (จำลองผู้เล่น "ตี-หลบ" กับมอนสเตอร์ทุกตัว เทียบชุดอุปกรณ์ต่างกัน)</h3>
<pre id="log">running…</pre>
<iframe id="g" src="../index.html" style="width:1280px;height:720px;border:1px solid #345;background:#000;opacity:.25"></iframe>
<script>
/* ใช้: tools\balance.ps1 [-Runs 4] [-Skill good|avg|poor]  หรือเปิดหน้านี้ผ่าน tools\serve.ps1
   แต่ละฉาก = เควส (ชนิด+ระดับ) × ชุดอุปกรณ์ (none / mid / max) × N รอบ — ผลเป็นตาราง */
(function () {
  var Q = new URLSearchParams(location.search), RUNS = +(Q.get('runs') || 4), SKILL = Q.get('skill') || 'good', TLIM = +(Q.get('tlim') || 300);
  var SIG = { expert: .025, good: .06, avg: .1, poor: .16 }[SKILL] || .06, ONLY = (Q.get('only') || '').split(',').filter(Boolean), GOD = Q.get('god') === '1';
  var fr = document.getElementById('g'), log = document.getElementById('log');
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function gauss() { var u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  var SCEN = [['q1_stag', 'stag T1'], ['q2_stag', 'stag T2'], ['q3_stag', 'stag T3'], ['q1_boar', 'boar T1'], ['q2_boar', 'boar T2'], ['q3_boar', 'boar T3'],
    ['q1_rabbit', 'rabbit T1'], ['q2_rabbit', 'rabbit T2'], ['q3_rabbit', 'rabbit T3'], ['q2_wolf', 'wolf T2'], ['q3_wolf', 'wolf T3'],
    ['q2_hive', 'hive T2'], ['q3_hive', 'hive T3'], ['q4_aggro', 'aggro T4'], ['q4_sov', 'sovereign T4']];
  var SLOTS = ['head', 'chest', 'arms', 'legs'];
  async function main() {
    var w, b, i;
    for (i = 0; i < 100; i++) { w = fr.contentWindow; if (w && w.__bh && w.BH_UI) break; await sleep(100); }
    b = w.__bh;
    function gear(kind) {
      var S = b.save();
      S.wk = 1; S.res = { }; S.eq = { head: '', chest: '', arms: '', legs: '' }; S.wt = {}; S.skills = {}; S.weapon = 'lance';
      if (kind === 'none') return;
      S.wk = kind === 'mid' ? 2 : 3;
      var best = Object.keys(b.SETS).reduce(function (a, k) { return b.SETS[k].dr > b.SETS[a].dr ? k : a; }, 'hide');
      var pick = kind === 'mid' ? 'hide' : best;
      SLOTS.forEach(function (sl) { S.res['arm_' + pick + '_' + sl] = true; S.eq[sl] = pick; });
      var node = kind === 'mid' ? 'lance_b1' : 'lance_b2'; S.wt = { lance: node };
    }
    function runOne(qid, gearKind) {
      var S = b.save();
      S.xp = 999999; S.wins = 20; S.hunts = 30; S.qclear = {};
      for (var qi = 0; qi < b.QUESTS.length; qi++) S.qclear[b.QUESTS[qi].id] = 1;
      S.forest = { stag: 60, boar: 60, rabbit: 60 }; S.eco = {}; S.cleared = { stag: 3, boar: 3, rabbit: 3, wolf: 3, hive: 3 };
      S.quest = qid; S.inv = { salve: 3, dart: 3, solvent: 3, antiinf: 3, antibio: 3, bait: 1, snare: 1 };
      gear(gearKind);
      b.ACTIONS.start();
      var P = b.state().P, M = b.state().M, K = b.keys, t = 0, dt = 1 / 60, nextDodgeAt = -1, lastAtkKey = null, dodgeFor = null, healCd = 0, res = null, st0 = b.state().stats;
      if (GOD) { P.hp = P.maxHp = 1e9; } var hp0 = P.hp;
      var steps = 0, maxSteps = TLIM * 60;
      while (steps++ < maxSteps) {
        P = b.state().P; M = b.state().M;
        if (b.state().mode !== 'playing') { res = 'ended'; break; }
        if (P.dead) { res = 'dead'; break; }
        if (M.state === 'downed' || M.hp <= 0) { res = 'win'; break; }
        K.w = K.a = K.s = K.d = false; K.j = false;
        var dx = M.x - P.x, dy = M.y - P.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
        /* หลบ: ตัดสินใจครั้งเดียวต่อท่า — เวลาเป้าหมาย = จบเทเลกราฟ − 0.15 วิ + เสียงรบกวน (เวลาตอบสนองมนุษย์) */
        if (M.state === 'tele' && M.atk) {
          if (dodgeFor !== M.atk) { dodgeFor = M.atk; M.atk.__plan = (M.atk.dur - .15) + gauss() * SIG; }
          if (M.atkT >= M.atk.__plan && P.st >= 16 && P.state !== 'dodge' && P.bufDodge <= 0 && !M.atk.__done) {
            M.atk.__done = true;
            var px = -uy, py = ux, s = Math.random() < .5 ? 1 : -1, ax = -ux * .6 + px * s * .8, ay = -uy * .6 + py * s * .8;
            K.a = ax < -.3; K.d = ax > .3; K.w = ay < -.3; K.s = ay > .3;
            P.bufDodge = .18;
          }
        }
        if (!(P.bufDodge > 0)) {
          var reach = 70 + M.r * .6;
          if (d > M.r + P.r + 38) { K.a = ux < -.3; K.d = ux > .3; K.w = uy < -.3; K.s = uy > .3; }
          else { K.a = ux < -.3; K.d = ux > .3; K.w = uy < -.3; K.s = uy > .3; }
          if (d < reach + 40 && P.st >= 24 && M.state !== 'tele' || (d < reach + 40 && P.st >= 40)) P.bufAtk = .22;
        }
        healCd -= dt;
        if (P.hp < P.maxHp * .38 && P.salves > 0 && P.state === 'free' && M.state !== 'tele' && healCd <= 0) { b.startHeal(); healCd = 3; }
        b.step(dt); t += dt;
      }
      P = b.state().P; M = b.state().M;
      if (!res) res = 'timeout';
      var S2 = b.state().stats;
      return { res: res, t: t, hpLeft: Math.max(0, P.hp), maxHp: P.maxHp, hits: S2.taken, salves: 3 - P.salves, dodges: S2.dodges, perfect: S2.perfect, mhp: M.hp, mmax: M.maxHp, rage: M.rageShown || 0 };
    }
    var out = [], lines = [], gears = ['none', 'mid', 'max'];
    for (var si = 0; si < SCEN.length; si++) {
      if (ONLY.length && ONLY.indexOf(SCEN[si][0]) < 0) continue;
      var row = { name: SCEN[si][1], g: {} };
      for (var gi = 0; gi < gears.length; gi++) {
        var R = [];
        for (var n = 0; n < RUNS; n++) { R.push(runOne(SCEN[si][0], gears[gi])); await sleep(0); }
        var win = R.filter(function (r) { return r.res === 'win'; });
        function avg(f, a) { a = a || R; return a.length ? a.reduce(function (s, r) { return s + f(r); }, 0) / a.length : 0; }
        var rc = {}; R.forEach(function (r) { rc[r.res] = (rc[r.res] || 0) + 1; });
        row.g[gears[gi]] = { rc: rc, win: win.length + '/' + R.length, t: Math.round(avg(function (r) { return r.t; }, win.length ? win : R)), hits: +avg(function (r) { return r.hits; }).toFixed(1), hpLost: Math.round(avg(function (r) { return r.maxHp - r.hpLeft; })), salves: +avg(function (r) { return r.salves; }).toFixed(1), perfect: +avg(function (r) { return r.perfect; }).toFixed(1), rage: +avg(function (r) { return r.rage; }).toFixed(1) };
      }
      out.push(row);
      lines.push((row.name + '          ').slice(0, 16) + gears.map(function (g) { var x = row.g[g]; return g + ': win ' + x.win + ' ' + JSON.stringify(x.rc) + ' · ' + x.t + 's · hit ' + x.hits + ' · HPlost ' + x.hpLost + ' · salve ' + x.salves + ' · rage ' + x.rage; }).join('  |  '));
      log.textContent = 'skill=' + SKILL + ' runs=' + RUNS + '\n' + lines.join('\n');
    }
    log.textContent = 'skill=' + SKILL + ' runs=' + RUNS + '\n' + lines.join('\n') + '\nDONE';
    window.__balance = { out: out, lines: lines, skill: SKILL, runs: RUNS };
  }
  main().catch(function (e) { log.textContent = 'ERROR ' + (e && e.stack || e); window.__balance = { error: String(e) }; });
})();
</script>
