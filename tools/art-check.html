<!doctype html><html lang="th"><meta charset="utf-8"><title>BIO HUNTER — ตรวจภาพในเกม</title>
<style>body{background:#111e17;color:#ecdfbf;font:15px Tahoma;margin:12px}button,select{font:inherit;background:#344b35;color:#fff;padding:9px;border:1px solid #749478;border-radius:7px;margin:4px}iframe{display:block;width:1280px;height:720px;border:0;margin:10px 0}pre{white-space:pre-wrap}</style>
<h2>BIO HUNTER v18.6.1 — ตรวจภาพในเกม</h2>
<p>หน้าตรวจนี้ใช้เกมจริงในกรอบด้านล่าง เลือกสนามหรือเขตป่าเพื่อดูภาพที่นำเข้า</p>
<select id="zone" aria-label="สนาม"><option>meadow</option><option>water</option><option>den</option><option>thicket</option><option>bloom</option></select>
<button id="battle">ดูสนาม</button>
<select id="region" aria-label="เขตป่า"><option>stag</option><option>boar</option><option>rabbit</option></select>
<button id="field">ดูภาคสนาม</button><button id="walk">เดิน</button><button id="stop">หยุดเดิน</button><button id="effects">ดูเอฟเฟกต์</button><button id="check">ตรวจทั้งหมด</button>
<iframe id="g" title="เกม BIO HUNTER" src="../index.art-review.html"></iframe><pre id="log">กำลังโหลดเกม…</pre>
<script>
var fr=document.getElementById('g'),w,b,errs=[],lines=[],checks=0,failed=0;
function out(){document.getElementById('log').textContent=lines.join('\n')}
function ok(name,value){checks++;if(!value)failed++;lines.push((value?'PASS ':'FAIL ')+name);out()}
function pause(){w.document.dispatchEvent(new w.KeyboardEvent('keydown',{key:'p',bubbles:true}));}
function clearKeys(){Object.keys(b.keys).forEach(function(k){b.keys[k]=false})}
function battle(){clearKeys();b.save().quest='q1_stag';b.ACTIONS.start();b.setArena(document.getElementById('zone').value);var st=b.state();st.M.state='stun';st.M.stDur=999;st.P.invuln=true;b.draw();}
function field(){clearKeys();var key=document.getElementById('region').value;b.save().wins=20;b.save().xp=999999;b.save().quest='';b.ACTIONS.target(key);b.ACTIONS.explore();var st=b.state(),c=b.CAMPS[0];st.P.x=c.x;st.P.y=c.y+62;b.draw();}
function effects(){battle();var p=b.state().P;b.FIRES().push({x:p.x+65,y:p.y+30,r:35,t:.5,life:8});b.CLOUDS().push({x:p.x+140,y:p.y-70,r:42,t:.5,life:8});b.ring(p.x+80,p.y-50,10,60,'#ffd45a',1.5,3);b.draw();}
async function check(){
 lines=[];checks=0;failed=0;
 ok('27 images decoded',b.visual().loaded.length===27);ok('no failed image loads',b.visual().failed.length===0);
 for(var key of ['meadow','water','den','thicket','bloom']){document.getElementById('zone').value=key;battle();var before=JSON.stringify(b.ROCKS);b.buildBg();ok('arena '+key+' painted',b.visual().draws['arena_'+key]>0);ok('rock positions unchanged '+key,JSON.stringify(b.ROCKS)===before)}
 for(var key of ['stag','boar','rabbit']){document.getElementById('region').value=key;field();ok('map '+key+' loaded',b.MAPKEY===key);ok('map geometry '+key,b.HAB.trees.length>0&&b.HAB.bushes.length>0);ok('ground '+key+' decoded',b.visual().loaded.indexOf('fld_ground_'+key)>=0);ok('painted water '+key,b.visual().draws['fld_water_'+key]>0)}
 document.getElementById('zone').value='meadow';battle();var p=b.state().P;
 var snapshots=[{state:'free',hurtT:0,blocking:false,want:0},{state:'free',hurtT:.3,blocking:false,want:7},{state:'dodge',hurtT:0,blocking:false,dodgeT:0,want:8},{state:'dodge',dodgeT:.1,want:9},{state:'dodge',dodgeT:.2,want:10},{state:'dodge',dodgeT:.29,want:11},{state:'free',blocking:true,want:12},{state:'atk',blocking:false,atk:{wind:.2,act:.2},atkT:.1,want:13},{state:'atk',atkT:.3,want:14},{state:'charge',want:15}];
 snapshots.forEach(function(s){Object.assign(p,s);ok('state selects frame '+s.want,b.wardenFrame(p)===s.want);b.draw()});p.state='free';p.atk=null;p.hurtT=0;p.blocking=false;
 var time=w.performance.now();for(var i=0;i<30;i++){p.x+=.5;b.frame(time+(i+1)*16)}ok('walking selects walk frame',b.visual().wardenFrame>=1&&b.visual().wardenFrame<=6);
 clearKeys();b.FIRES().push({x:p.x+60,y:p.y,r:30,t:.5,life:5});b.CLOUDS().push({x:p.x+120,y:p.y,r:40,t:.5,life:5});b.ring(p.x+80,p.y-80,10,65,'#ffd45a',.6,3);b.draw();
 for(var key of ['fx_fire','fx_spore','fx_impact','fld_tent','fld_campfire','fld_tree_a','fld_tree_b','fld_tree_c','fld_bush_a','fld_bush_b','fld_bush_c','warden_sheet'])ok('rendered '+key,b.visual().draws[key]>0);
 ok('no runtime errors',errs.length===0);lines.push(failed?'RESULT: FAILED '+failed:'RESULT: ALL PASSED ('+checks+' checks)');out();window.__artCheck={checks:checks,failed:failed,errors:errs,log:lines};
}
async function boot(){for(var i=0;i<150;i++){w=fr.contentWindow;if(w&&w.__bh&&w.__bh.visual().loaded.length===27)break;await new Promise(function(r){setTimeout(r,100)})}b=w.__bh;if(!b)return;b.frame(w.performance.now());w.addEventListener('error',function(e){errs.push(e.message)});document.getElementById('log').textContent='โหลดภาพ '+b.visual().loaded.length+' / 27 · เลือกฉากเพื่อตรวจได้';
 document.getElementById('battle').onclick=battle;document.getElementById('field').onclick=field;document.getElementById('effects').onclick=effects;document.getElementById('walk').onclick=function(){b.keys.d=true};document.getElementById('stop').onclick=clearKeys;document.getElementById('check').onclick=check;
 if(location.search.indexOf('auto=1')>=0)await check();}
boot();
</script></html>
